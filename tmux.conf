# =============================================================================
# tmux Configuration for AI-assisted coding with Claude Code / OpenCode
# =============================================================================

# ---------------------------------------------------------------------------
# Local Overrides (user-owned, never overwritten by install.sh)
# ---------------------------------------------------------------------------
# Sourced first so user values (e.g. @git_tui/@file_tui) win. -q stays silent
# if the file does not (yet) exist.
source-file -q ~/.tmux.conf.local

# ---------------------------------------------------------------------------
# General Settings
# ---------------------------------------------------------------------------

# Set default terminal with 256-color and true-color support
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"

# Kitty keyboard protocol: forward extended keys to inner apps.
# Without this, Claude Code inside tmux cannot see Shift+Enter (newline
# without submit), because it only detects TERM=xterm-256color, not Ghostty.
# xterm* matches both xterm-ghostty and the xterm-256color fallback.
set -as terminal-features "xterm*:extkeys"
set -g extended-keys always
set -g extended-keys-format csi-u

# Enable OSC 52 clipboard passthrough (essential for remote tmux over SSH)
set -g set-clipboard on

# Allow nested OSC 52 sequences (vim/neovim → tmux → Ghostty)
set -g allow-passthrough on

# Large scrollback buffer (Claude/OpenCode produce lots of output)
set -g history-limit 50000

# Small escape-time is more robust over SSH latency (ESC/meta sequences can
# arrive split across packets); still imperceptible in vim/Claude Code.
set -sg escape-time 10

# Faster key repetition
set -g repeat-time 600

# Focus events (useful for Vim/editor integration)
set -g focus-events on

# Start windows and panes at 1 (ergonomic, matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Set terminal title
set -g set-titles on
set -g set-titles-string "#S | #W"

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity off

# ---------------------------------------------------------------------------
# Prefix Key: Ctrl+a
# ---------------------------------------------------------------------------

unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---------------------------------------------------------------------------
# Mouse Support
# ---------------------------------------------------------------------------

# Mouse on: clickable status-bar menus, click-to-select panes, scroll.
# For native Ghostty text selection/copy, hold Shift while dragging.
# Toggle with Ctrl+a Ctrl+t.
set -g mouse on

# Ghostty click reliability: in Ghostty+tmux with mouse on, status/pane clicks
# often need 2-3 presses to register (ghostty-org/ghostty discussion #11342).
# Switching window/pane selection from MouseDown to MouseUp fixes it. These
# target the window-list (Status) and pane body (Pane) regions only — the
# clickable menus use StatusLeft/StatusRight and are unaffected.
unbind -T root MouseDown1Status
bind -T root MouseUp1Status      switch-client -t=
bind -T root MouseDragEnd1Status switch-client -t=
bind -T root MouseUp1Pane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  { select-pane -t= ; send-keys -M } { select-pane -t= }

# ---------------------------------------------------------------------------
# Vi-Mode (Copy Mode)
# ---------------------------------------------------------------------------

setw -g mode-keys vi

# Enter copy mode with Prefix + [
# Vi-style selection and yank
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# ---------------------------------------------------------------------------
# Pane Management
# ---------------------------------------------------------------------------

# Intuitive splits (open in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation with Alt+hjkl (no prefix needed)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Pane resizing with Prefix + HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---------------------------------------------------------------------------
# Window Management
# ---------------------------------------------------------------------------

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Window navigation with Shift+Left/Right (no prefix needed)
bind -n S-Left previous-window
bind -n S-Right next-window

# Swap windows with Ctrl+Shift+Left/Right
bind -n C-S-Left swap-window -t -1\; select-window -t -1
bind -n C-S-Right swap-window -t +1\; select-window -t +1

# Cycle through all sessions — Ctrl+a Tab = next, Shift+Tab = previous
# (Windows-Alt+Tab-style). -n/-p walk every session in stable list order.
bind Tab  switch-client -n
bind BTab switch-client -p

# ---------------------------------------------------------------------------
# Utility Keybindings
# ---------------------------------------------------------------------------

# Reload configuration
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Start-or-Switch singleton TUI tabs (existing tab -> focus : -> create+run).
bind g run-shell "~/.tmux/scripts/tui-tab.sh git"
bind F run-shell "~/.tmux/scripts/tui-tab.sh files"

# Toggle mouse support (useful for testing or changing preference)
bind C-t set -g mouse \; display-message "Mouse #{?mouse,ON,OFF}"

# Synchronize panes toggle (useful for multi-pane commands)
bind S setw synchronize-panes \; display-message "Sync #{?synchronize-panes,ON,OFF}"

# ---------------------------------------------------------------------------
# Status Bar (Informative Style)
# ---------------------------------------------------------------------------

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# Colors
set -g status-style "bg=#1a1b26,fg=#a9b1d6"

# Left: all sessions (current as accent badge, others muted). The script
# emits tmux #[..] style codes per session; bg resets to dark before the
# trailing space. Click anywhere on the left -> session menu (MouseUp1StatusLeft).
set -g status-left-length 80
set -g status-left "#[bg=#1a1b26]#(bash ~/.tmux/scripts/sessions.sh '#S')#[bg=#1a1b26] "

# Right: Toolbar button [+], shortened path, git branch, hostname, date/time
set -g status-right-length 120
set -g status-right "#[fg=#1a1b26,bg=#e0af68,bold] + #[fg=#e0af68,bg=#1a1b26] #[fg=#a9b1d6]#(bash ~/.tmux/scripts/shorten-path.sh '#{pane_current_path}') #[fg=#3b4261]| #[fg=#565f89]#(cd #{pane_current_path}; git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '-') #[fg=#3b4261]| #[fg=#a9b1d6]#H #[fg=#3b4261]| #[fg=#1a1b26,bg=#7aa2f7,bold] %d.%m %H:%M "

# Window status (clickable: left-click switches window)
setw -g window-status-format "#[fg=#565f89] #I:#W#{?window_activity_flag, *,} "
setw -g window-status-current-format "#[fg=#7aa2f7,bold] #I:#W #[fg=default]"
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Message styling
set -g message-style "bg=#7aa2f7,fg=#1a1b26,bold"
set -g message-command-style "bg=#3b4261,fg=#a9b1d6"

# ---------------------------------------------------------------------------
# Mouse Menus (Clickable Status Bar)
# ---------------------------------------------------------------------------
# Left-click the session name (left) or the [+] button (right) to open menus.
# Keyboard shortcuts Prefix + m (window/pane) and Prefix + M (session) provide
# the same actions without the mouse.
# ---------------------------------------------------------------------------

# --- Mouse: Left-click on the status bar ---

# Click on [+] button (status-right area) -> Quick Actions menu
bind -T root MouseUp1StatusRight display-menu -OM -T "#[align=centre]Quick Actions" -x R -y S \
    "Cheat-Sheet"   ? { display-popup -E -w 70% -h 70% -T "#[align=centre,fg=#7aa2f7,bold]tmux Cheat-Sheet" "bash ~/.tmux/scripts/cheatsheet.sh | less -R" } \
    "About"         i { display-popup -E -w 70% -h 70% -T "#[align=centre,fg=#7aa2f7,bold]vybemux — About" "bash ~/.tmux/scripts/about.sh | less -R" } \
    "Split Vertical    |"   | { split-window -h -c "#{pane_current_path}" } \
    "Split Horizontal  -"   - { split-window -v -c "#{pane_current_path}" } \
    ""                        \
    "New Window"            w { new-window -c "#{pane_current_path}" } \
    "AI Tools"              a { run-shell "~/.tmux/scripts/ai-tools-menu.sh" } \
    "Git (lazygit)"         g { run-shell "~/.tmux/scripts/tui-tab.sh git" } \
    "Files (yazi)"          F { run-shell "~/.tmux/scripts/tui-tab.sh files" } \
    ""                        \
    "Close Pane"            x { kill-pane } \
    "#{?window_zoomed_flag,Unzoom,Zoom} Pane" z { resize-pane -Z } \
    ""                        \
    "Save Session"          S { run-shell "~/.tmux/plugins/tmux-resurrect/scripts/save.sh" } \
    "Restore Session"       R { run-shell "~/.tmux/plugins/tmux-resurrect/scripts/restore.sh" }

# Click on session name (left) -> Session actions menu
bind -T root MouseUp1StatusLeft display-menu -OM -T "#[align=centre]Session: #{session_name}" -x M -y S \
    "Session List"          s { choose-tree -Zs } \
    ""                        \
    "Next Session"          n { switch-client -n } \
    "Previous Session"      p { switch-client -p } \
    ""                        \
    "New Session"           S { new-session } \
    "Rename Session"        r { command-prompt -I "#S" { rename-session "%%" } } \
    ""                        \
    "Detach"                d { detach-client } \
    "Kill Session"          X { confirm-before -p "Kill session #S? (y/n)" kill-session }

# --- Keyboard: Prefix + m/M ---

# Prefix + m -> Window/Pane actions menu (centered)
# No -O/-M: keyboard-driven so it survives mouse motion. Windows Terminal
# reports mouse-move as release-like events, which closes any mouse-handling
# tmux menu instantly; a keyboard menu is stable in WT and Ghostty. Select via
# the per-item shortcut key (a, w, x, ...) or arrows + Enter.
bind m display-menu -T "#[align=centre]Window/Pane Actions" -x C -y C \
    "Cheat-Sheet"   ? { display-popup -E -w 70% -h 70% -T "#[align=centre,fg=#7aa2f7,bold]tmux Cheat-Sheet" "bash ~/.tmux/scripts/cheatsheet.sh | less -R" } \
    "About"         i { display-popup -E -w 70% -h 70% -T "#[align=centre,fg=#7aa2f7,bold]vybemux — About" "bash ~/.tmux/scripts/about.sh | less -R" } \
    "Split Vertical    |"   | { split-window -h -c "#{pane_current_path}" } \
    "Split Horizontal  -"   - { split-window -v -c "#{pane_current_path}" } \
    ""                        \
    "New Window"            w { new-window -c "#{pane_current_path}" } \
    "AI Tools"              a { run-shell "~/.tmux/scripts/ai-tools-menu.sh" } \
    "Git (lazygit)"         g { run-shell "~/.tmux/scripts/tui-tab.sh git" } \
    "Files (yazi)"          F { run-shell "~/.tmux/scripts/tui-tab.sh files" } \
    ""                        \
    "#{?#{>:#{session_windows},1},,-}Swap Left"  l { swap-window -t :-1 } \
    "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } \
    ""                        \
    "Rename Window"         R { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } \
    "Close Pane"            x { kill-pane } \
    "Close Window"          X { kill-window } \
    ""                        \
    "#{?window_zoomed_flag,Unzoom,Zoom} Pane" z { resize-pane -Z }

# Prefix + M -> Session actions menu (centered)
# Keyboard-driven (no -O/-M) for the same Windows Terminal reason as Prefix + m.
bind M display-menu -T "#[align=centre]Session: #{session_name}" -x C -y C \
    "Session List"          s { choose-tree -Zs } \
    ""                        \
    "Next Session"          n { switch-client -n } \
    "Previous Session"      p { switch-client -p } \
    ""                        \
    "New Session"           S { new-session } \
    "Rename Session"        r { command-prompt -I "#S" { rename-session "%%" } } \
    ""                        \
    "Detach"                d { detach-client } \
    "Kill Session"          X { confirm-before -p "Kill session #S? (y/n)" kill-session }

# ---------------------------------------------------------------------------
# TPM (tmux Plugin Manager)
# ---------------------------------------------------------------------------

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
# No "->" mapping for claude: resurrect-claude-hook.sh already writes
# "claude --resume <sessionId>" (or the fallback "claude --resume") to the
# save file during saving; restore.sh must preserve that line unchanged.
set -g @resurrect-processes '"~claude" "~opencode->opencode --continue" "codex->codex resume --last" "pi->pi --continue" "lazygit" "yazi"'
# codex/pi have no "~" prefix (unlike opencode): codex is a native binary
# whose ps command line retains arguments, so it matches anchored against the
# first word. pi overwrites process.title with the bare word "pi" (a Node CLI
# convention)—a "~pi" substring match would incorrectly match panes such as
# "pip install". Both tools filter their "last session" by the current
# working directory themselves (see pi: ~/.pi/agent/sessions/<path>/; codex:
# `resume --last` is cwd-filtered according to --help), so restore.sh (which
# first recreates every pane in its saved directory) automatically provides
# the correct session for each pane.
# During saving, replaces the command line of every claude pane with
# "claude --resume <sessionId>" (from ~/.claude/sessions/<PID>.json), so
# restore.sh resumes without an interactive picker. See scripts/resurrect-claude-hook.sh.
# To set a custom post-save-layout hook through ~/.tmux.conf.local: this value
# is set after sourcing .local (line 10) and therefore overrides it. Invoke
# this hook yourself and chain to the script path above rather than replacing it.
set -g @resurrect-hook-post-save-layout '~/.tmux/scripts/resurrect-claude-hook.sh'
set -goFq @vybemux-resurrect-hook-post-save-all '#{@resurrect-hook-post-save-all}'
set -g @resurrect-hook-post-save-all '~/.tmux/scripts/harden-resurrect-permissions.sh --run-user-hook'

# tmux-continuum settings (auto-save every 15 minutes)
set -g @continuum-save-interval '15'

# tmux-yank settings: force OSC 52 copy so yanks reach the local clipboard
# over SSH without X11 tools. Ghostty supports OSC 52 writes natively.
set -g @custom_copy_command 'base64 -w0 | xargs printf '\''\033]52;c;%s\033\\'\'''

# Initialize TPM (keep this line at the very bottom of tmux.conf). Guarded:
# a fresh clone or a clean-HOME syntax check (scripts/validate-tmux-conf.sh)
# has no ~/.tmux/plugins/tpm yet, and an unguarded `run` would source-file-error.
if-shell "test -f ~/.tmux/plugins/tpm/tpm" \
    "run '~/.tmux/plugins/tpm/tpm'"
